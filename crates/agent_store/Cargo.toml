[package]
name = "agent_store"
version = "0.1.0"
edition = "2024"

[dependencies]
agent_protocol = { path = "../agent_protocol" }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
