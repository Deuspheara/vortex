[package]
name = "agent_eval"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_eval"
path = "src/lib.rs"

[[bin]]
name = "agent_eval"
path = "src/main.rs"

[dependencies]
agent_protocol = { path = "../agent_protocol" }
agent_context = { path = "../agent_context" }
agent_tools = { path = "../agent_tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
