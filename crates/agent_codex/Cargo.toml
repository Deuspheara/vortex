[package]
name = "agent_codex"
version = "0.1.0"
edition = "2024"

[dependencies]
agent_protocol = { path = "../agent_protocol" }
agent_store = { path = "../agent_store" }
chrono = "0.4"
base64 = "0.22"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
