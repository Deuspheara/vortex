[workspace]
resolver = "2"

members = [
    "crates/agent_protocol",
    "crates/agent_store",
    "crates/agent_core",
    "crates/agent_models",
    "crates/agent_tools",
    "crates/agent_sandbox",
    "crates/agent_context",
    "crates/agent_shell",
    "crates/android_device",
    "crates/agent_eval",
    "crates/project_index",
    "crates/context_providers",
    "crates/real_process",
    "crates/app",
    "crates/terminal",
]

[profile.dev]
# Keep normal debug ergonomics, but lift hot UI code out of fully unoptimized
# codegen. Profiling shows the app/sidebar/thread Rust work is already sub-ms,
# so the remaining smoothness gap is more likely in GPUI/render-stack execution
# during dev builds than in our own view logic.
opt-level = 1

[profile.dev.package.app]
opt-level = 2

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.terminal]
opt-level = 2
